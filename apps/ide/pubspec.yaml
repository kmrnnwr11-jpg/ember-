name: ide
description: FlutterCursor — a Cursor-style IDE for building Flutter apps from phone, tablet and desktop.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  ide_core: ^0.1.0
  ai_connect: ^0.1.0
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.0
  dio: ^5.9.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.1.1
  supabase_flutter: ^2.10.0
  re_editor: ^0.8.0
  re_highlight: ^0.0.3
  xterm: ^4.0.0
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  flutter_markdown_plus: ^1.0.12
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Nosifer
      fonts:
        - asset: assets/fonts/Nosifer-Regular.ttf
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
