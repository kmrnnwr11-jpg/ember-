# Local/prod stack: Runner + Redis + Caddy. Workspace containers are created by the Runner.
# Usage: cp .env.example .env && docker compose -f infra/docker-compose.yml up -d --build
name: ember

services:
  runner:
    build: ../apps/runner
    env_file: ../.env
    environment:
      WORKSPACE_DRIVER: docker
      # Must be the same absolute path on host and in the container: the Runner
      # passes it to the Docker daemon as a bind-mount source.
      WORKSPACES_ROOT: ${HOST_WORKSPACES_ROOT:-/srv/ember/workspaces}
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_WORKSPACES_ROOT:-/srv/ember/workspaces}:${HOST_WORKSPACES_ROOT:-/srv/ember/workspaces}
      - runner-data:/data
    networks: [edge, workspaces]
    restart: unless-stopped
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [edge]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    restart: unless-stopped
    profiles: [prod]

  # Build-only service so `docker compose build` also produces the workspace image.
  workspace-image:
    build: ./workspace
    image: ember/workspace:latest
    profiles: [build]

networks:
  edge: {}
  workspaces:
    name: fc-workspaces

volumes:
  runner-data: {}
  redis-data: {}
  caddy-data: {}
